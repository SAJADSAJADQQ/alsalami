<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>مركز السلامي | تواصل جوال</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Almarai', sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            padding: 18px 16px 40px;
            background-image: radial-gradient(circle at 10% 20%, rgba(200, 220, 240, 0.4) 2%, transparent 2.5%);
            background-size: 28px 28px;
        }

        /* حاوية الجوال بالكامل - عمودية وبسيطة */
        .mobile-container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* كرت الهيدر: شكل لطيف منسدل */
        .hero-card {
            background: white;
            border-radius: 48px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
        }

        .hero-card::after {
            content: "✧";
            font-size: 120px;
            color: #eef3fc;
            position: absolute;
            bottom: -30px;
            left: -20px;
            opacity: 0.5;
            pointer-events: none;
            font-weight: 100;
        }

        .avatar-icon {
            background: #dcfce7;
            width: 80px;
            height: 80px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 44px;
            color: #2b7a4b;
            box-shadow: 0 8px 14px rgba(0,0,0,0.05);
        }

        .hero-card h1 {
            font-size: 1.9rem;
            font-weight: 800;
            color: #1f2e3a;
            letter-spacing: -0.5px;
        }

        .hero-card p {
            color: #5a6e7c;
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .hero-badge {
            background: #eef2f5;
            display: inline-block;
            padding: 5px 16px;
            border-radius: 100px;
            font-size: 0.7rem;
            color: #2c6e49;
            margin-top: 18px;
            font-weight: 700;
        }

        /* قائمة خيارات التواصل - بطاقات بيضاء ناعمة */
        .contact-option {
            background: white;
            border-radius: 32px;
            padding: 8px 12px 8px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.25s ease;
            cursor: pointer;
            border: 1px solid #eef2f8;
        }

        .contact-option:active {
            transform: scale(0.97);
            background: #fefefe;
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .icon-bg {
            width: 58px;
            height: 58px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        /* ألوان خلفية الأيقونات */
        .fb-bg {
            background: #eef2ff;
            color: #1877f2;
        }
        .ig-bg {
            background: #fceef4;
            color: #e4405f;
        }
        .wa-bg {
            background: #e6f7ef;
            color: #25D366;
        }

        .info h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #1e2c3a;
        }

        .info span {
            font-size: 0.7rem;
            color: #7e8c9c;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
        }

        .chevron-icon {
            background: #f0f3f8;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #92a3b5;
            font-size: 18px;
        }

        /* بطاقة الاتصال السريع - زر واتساب مميز */
        .whatsapp-float-card {
            background: linear-gradient(135deg, #1f5e3a, #128C7E);
            border-radius: 32px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            margin-top: 8px;
            box-shadow: 0 12px 18px -8px rgba(18, 140, 126, 0.3);
        }

        .whatsapp-float-card .left-text h4 {
            font-size: 1.1rem;
            font-weight: 800;
        }
        .whatsapp-float-card .left-text p {
            font-size: 0.7rem;
            opacity: 0.9;
        }
        .whatsapp-float-card i {
            font-size: 32px;
            background: white;
            color: #128C7E;
            border-radius: 50%;
            padding: 8px;
            width: 52px;
            text-align: center;
        }

        /* روابط النص المساعدة أسفل الشاشة */
        .footer-links {
            background: transparent;
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        .footer-links a {
            text-decoration: none;
            font-size: 0.75rem;
            color: #6681a0;
            font-weight: 500;
            background: rgba(255,255,240,0.6);
            padding: 6px 16px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }
        .footer-links a i {
            margin-left: 6px;
        }

        .credit-note {
            text-align: center;
            font-size: 0.65rem;
            color: #9aaebf;
            margin-top: 20px;
        }

        /* إضافة مسافة بين العناصر */
        .group-title {
            padding-right: 8px;
            margin-bottom: 12px;
            margin-top: 8px;
            color: #3c5a6f;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: -0.2px;
        }
    </style>
</head>
<body>
<div class="mobile-container">
    <!-- قسم الترحيب بشكل جذاب للجوال -->
    <div class="hero-card">
        <div class="avatar-icon">
            <i class="fas fa-hand-sparkles"></i>
        </div>
        <h1>مركز السلامي</h1>
        <p>فريقنا على بعد نقرة واحدة</p>
        <div class="hero-badge">
            <i class="fas fa-comment-dots"></i> رد سريع خلال دقائق
        </div>
    </div>

    <!-- عناوين توضيحية بسيطة -->
    <div class="group-title">
        <i class="fas fa-globe"></i> اختر قناة التواصل
    </div>

    <!-- خيار فيسبوك (بطاقة قابلة للنقر) -->
    <div class="contact-option" onclick="openFacebook()">
        <div class="option-left">
            <div class="icon-bg fb-bg">
                <i class="fab fa-facebook-f"></i>
            </div>
            <div class="info">
                <h3>فيسبوك</h3>
                <span><i class="fas fa-newspaper"></i> </span>
            </div>
        </div>
        <div class="chevron-icon">
            <i class="fas fa-arrow-left"></i>
        </div>
    </div>

    <!-- خيار إنستغرام -->
    <div class="contact-option" onclick="openInstagram()">
        <div class="option-left">
            <div class="icon-bg ig-bg">
                <i class="fab fa-instagram"></i>
            </div>
            <div class="info">
                <h3>إنستغرام</h3>
                <span><i class="fas fa-image"></i> </span>
            </div>
        </div>
        <div class="chevron-icon">
            <i class="fas fa-arrow-left"></i>
        </div>
    </div>

    <!-- خيار واتساب (قناة المحادثة) -->
    <div class="contact-option" onclick="openWhatsApp()">
        <div class="option-left">
            <div class="icon-bg wa-bg">
                <i class="fab fa-whatsapp"></i>
            </div>
            <div class="info">
                <h3>واتساب</h3>
                <span><i class="fas fa-headset"></i> دردشة فورية مع الدعم</span>
            </div>
        </div>
        <div class="chevron-icon">
            <i class="fas fa-arrow-left"></i>
        </div>
    </div>

    <!-- زر اتصال سريع منفصل للواتساب بنمط مختلف -->
    <div class="whatsapp-float-card" onclick="openWhatsApp()">
        <div class="left-text">
            <h4><i class="fab fa-whatsapp"></i> تواصل الآن عبر واتساب</h4>
            <p>اضغط هنا للدردشة المباشرة</p>
        </div>
        <i class="fab fa-whatsapp"></i>
    </div>

    <!-- روابط بديلة نصية أسفل (تماماً كدعم إضافي) -->
    <div class="footer-links">
        <a href="https://www.facebook.com/profile.php?id=61560751594222" target="_blank"><i class="fab fa-facebook-f"></i> صفحتنا</a>
        <a href="https://www.instagram.com/alsalamistore?igsh=YWphZHVoem8xbW5u" target="_blank"><i class="fab fa-instagram"></i> متجر السلامي</a>
        <a href="https://wa.me/9647833224477?text=مرحباً، أرغب بالاستفسار عن الخدمات" target="_blank"><i class="fab fa-whatsapp"></i> رقم الواتساب</a>
    </div>

    <div class="credit-note">
        <i class="fas fa-mobile-alt"></i>    مركز السلامي - خدمة عملاء 24/7
    </div>
</div>

<script>
    // الوظائف المطلوبة (نفس الروابط الأصلية تماماً)
    function openFacebook() {
        window.open('https://www.facebook.com/profile.php?id=61560751594222', '_blank');
    }
    function openInstagram() {
        window.open('https://www.instagram.com/alsalamistore?igsh=YWphZHVoem8xbW5u', '_blank');
    }
    function openWhatsApp() {
        const phoneNumber = '9647833224477';
        const message = encodeURIComponent('مرحباً، أرغب بالاستفسار عن الخدمات');
        window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
    }

    // إضافة تأثيرات لمسية محسّنة للجوال
    const allClickables = document.querySelectorAll('.contact-option, .whatsapp-float-card');
    allClickables.forEach(el => {
        el.addEventListener('touchstart', function() {
            this.style.opacity = '0.7';
        }, { passive: true });
        el.addEventListener('touchend', function() {
            this.style.opacity = '1';
        });
        el.addEventListener('touchcancel', function() {
            this.style.opacity = '1';
        });
    });

    // للتأكد من تحميل الصفحة وإظهار الاختلاف الكامل
    window.addEventListener('DOMContentLoaded', () => {
        console.log('📱✅ تصميم جوال جديد بالكامل - بطاقات انسيابية، أزرار منسدلة، ومناسبة لليد الواحدة');
        console.log('🔗 تم الاحتفاظ بجميع روابط فيسبوك، إنستغرام، واتساب كما هو مطلوب');
        
        // تأثير ظهور متتالي خفيف للعناصر (تجربة smooth)
        const items = document.querySelectorAll('.contact-option, .whatsapp-float-card, .hero-card');
        items.forEach((item, idx) => {
            item.style.opacity = '0';
            item.style.transform = 'translateY(12px)';
            setTimeout(() => {
                item.style.transition = 'opacity 0.4s ease, transform 0.35s ease';
                item.style.opacity = '1';
                item.style.transform = 'translateY(0)';
            }, idx * 60);
        });
    });
</script>
</body>
</html>
